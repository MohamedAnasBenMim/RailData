name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RAILDATA_DATA_DIR: ${{ github.workspace }}/data
      RAILDATA_DUCKDB: ${{ github.workspace }}/data/warehouse/raildata.duckdb
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Tests (pytest)
        run: pytest -q

      - name: Full pipeline (8 weeks of synthetic deliveries)
        run: raildata --data-dir data run --start 2026-03-02 --end 2026-04-26 --metrics-out run_metrics.json

      - name: Daily incremental run, twice (must be idempotent)
        run: |
          raildata --data-dir data run --date 2026-04-27 > run1.json
          raildata --data-dir data run --date 2026-04-27 > run2.json
          python - <<'PY'
          import json
          a, b = (json.load(open(f)) for f in ("run1.json", "run2.json"))
          assert a["rows_per_layer"] == b["rows_per_layer"], (a["rows_per_layer"], b["rows_per_layer"])
          print("idempotent:", a["rows_per_layer"]["gold.fct_stop_events"], "rows")
          PY

      - name: dbt build (standalone, whole history)
        working-directory: dbt
        run: dbt build --profiles-dir .

      - name: Report
        run: raildata --data-dir data report --out charts

      - uses: actions/upload-artifact@v4
        with:
          name: raildata-report
          path: |
            charts/
            run_metrics.json
