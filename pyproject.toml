[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "raildata"
version = "0.1.0"
description = "ELT pipeline for railway punctuality data: GTFS + realised events -> DuckDB/dbt analytics marts"
readme = "README.md"
license = "MIT"
authors = [{ name = "Mohamed Anas Ben Mim" }]
requires-python = ">=3.12"
dependencies = [
    "duckdb==1.4.1",
    "dbt-core==1.10.13",
    "dbt-duckdb==1.10.0",
    "polars==1.34.0",
    "pyarrow==21.0.0",
    "numpy==2.3.4",
    "matplotlib==3.10.7",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.1"]

[project.scripts]
raildata = "raildata.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
